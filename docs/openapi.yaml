openapi: 3.1.0
info:
  title: CampusRoute — Optimizador de Rutas Universitarias Accesibles API
  version: 1.0.0
  description: |
    Contrato oficial (fuente de verdad) para la hackathon de 6 horas.
    - **Persona A**: `/health`, `/auth/*`, `/campus/*`, `/incidents/*`
    - **Persona B**: `/routes/calculate` (grafo ponderado A* / Dijkstra), `/external/weather` (Open-Meteo)
    - **Persona C**: Frontend (mapa 2.5D isométrico SVG) contra Prism (`VITE_API_URL=http://localhost:4010`) hasta la hora 4.

servers:
  - url: http://localhost:8000
    description: Backend local (FastAPI)
  - url: http://localhost:4010
    description: Mock local (Prism)

tags:
  - name: Health
  - name: Auth
  - name: Campus
  - name: Incidents
  - name: Routes
  - name: External

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT emitido por Supabase Auth.

  schemas:
    ErrorCode:
      type: string
      enum: [VALIDATION_ERROR, UNAUTHORIZED, NOT_FOUND, NO_ACCESSIBLE_ROUTE, ROUTE_NOT_FOUND, EXTERNAL_SERVICE_ERROR, INTERNAL_ERROR]

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
            details:
              type: object
              additionalProperties: true

    HealthResponse:
      type: object
      required: [status, database, timestamp]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        database:
          type: string
          enum: [connected, disconnected]
        timestamp:
          type: string
          format: date-time
      example:
        status: ok
        database: connected
        timestamp: '2026-11-21T12:00:00Z'

    UserProfile:
      type: object
      required: [id, email, full_name, reduced_mobility, prefer_covered]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        full_name:
          type: string
        reduced_mobility:
          type: boolean
        prefer_covered:
          type: boolean
      example:
        id: '11111111-2222-3333-4444-555555555555'
        email: estudiante.demo@uni.edu
        full_name: Ana Pérez
        reduced_mobility: true
        prefer_covered: false

    UpdatePreferencesRequest:
      type: object
      properties:
        reduced_mobility:
          type: boolean
        prefer_covered:
          type: boolean

    NodeType:
      type: string
      enum: [entrance, room, corridor, elevator, stairs, ramp]

    EdgeType:
      type: string
      enum: [corridor, stairs, elevator, ramp, outdoor]

    ConflictType:
      type: string
      enum: [elevator_broken, stairs_blocked, ramp_obstructed, corridor_closed, crowd_congestion]

    IncidentSeverity:
      type: string
      enum: [blocking, warning]

    IncidentStatus:
      type: string
      enum: [active, resolved]

    SearchAlgorithm:
      type: string
      enum: [astar, dijkstra]

    CampusBuilding:
      type: object
      description: Geometría básica para renderizar bloques 2.5D isométricos.
      required: [id, name, x, y, width, height, floors, color]
      properties:
        id:
          type: string
        name:
          type: string
        x:
          type: integer
        y:
          type: integer
        width:
          type: integer
        height:
          type: integer
        floors:
          type: integer
          minimum: 1
        color:
          type: string

    CampusNode:
      type: object
      required: [id, name, building, floor, node_type, x, y, z, is_destination, landmark]
      properties:
        id:
          type: string
        name:
          type: string
        building:
          type: string
        floor:
          type: integer
          minimum: 1
        node_type:
          $ref: '#/components/schemas/NodeType'
        x:
          type: integer
          description: Coordenada horizontal del plano (unidades SVG).
        y:
          type: integer
          description: Coordenada de profundidad del plano (unidades SVG).
        z:
          type: integer
          description: Elevación en metros para proyección 2.5D y heurística A* (0 = piso 1, 4 = piso 2).
        is_destination:
          type: boolean
        landmark:
          type: string

    CampusEdge:
      type: object
      required: [id, from_node_id, to_node_id, distance_m, base_weight, edge_type, is_accessible, is_covered, bidirectional]
      properties:
        id:
          type: string
        from_node_id:
          type: string
        to_node_id:
          type: string
        distance_m:
          type: integer
          minimum: 1
        base_weight:
          type: number
          format: float
          minimum: 0.1
          description: Multiplicador de costo base (1.0 pasillo, 1.15 rampa, 1.3 ascensor, 1.4 escalera).
        edge_type:
          $ref: '#/components/schemas/EdgeType'
        is_accessible:
          type: boolean
        is_covered:
          type: boolean
        bidirectional:
          type: boolean

    Incident:
      type: object
      required: [id, target_type, conflict_type, severity, status, description, reported_at]
      properties:
        id:
          type: string
        target_type:
          type: string
          enum: [node, edge]
        node_id:
          type: [string, 'null']
        edge_id:
          type: [string, 'null']
        conflict_type:
          $ref: '#/components/schemas/ConflictType'
        severity:
          $ref: '#/components/schemas/IncidentSeverity'
        status:
          $ref: '#/components/schemas/IncidentStatus'
        description:
          type: string
        reported_at:
          type: string
          format: date-time
        resolved_at:
          type: [string, 'null']
          format: date-time
      example:
        id: inc-101
        target_type: node
        node_id: n-ascensor-a-p1
        edge_id: null
        conflict_type: elevator_broken
        severity: blocking
        status: active
        description: Ascensor Edificio A fuera de servicio por mantenimiento
        reported_at: '2026-11-21T10:15:00Z'
        resolved_at: null

    CreateIncidentRequest:
      type: object
      required: [target_type, conflict_type, severity, description]
      properties:
        target_type:
          type: string
          enum: [node, edge]
        node_id:
          type: [string, 'null']
        edge_id:
          type: [string, 'null']
        conflict_type:
          $ref: '#/components/schemas/ConflictType'
        severity:
          $ref: '#/components/schemas/IncidentSeverity'
        description:
          type: string
          minLength: 3
          maxLength: 280
      example:
        target_type: node
        node_id: n-ascensor-b-p1
        edge_id: null
        conflict_type: elevator_broken
        severity: blocking
        description: Ascensor trabado en el primer piso

    UpdateIncidentRequest:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/IncidentStatus'
        severity:
          $ref: '#/components/schemas/IncidentSeverity'
        description:
          type: string
          minLength: 3
          maxLength: 280
      example:
        status: resolved
        description: Reparado por mantenimiento

    CampusMapResponse:
      type: object
      required: [campus_name, viewbox, floors, buildings, nodes, edges, active_incidents]
      properties:
        campus_name:
          type: string
        viewbox:
          type: object
          required: [width, height]
          properties:
            width:
              type: integer
            height:
              type: integer
        floors:
          type: array
          items:
            type: integer
        buildings:
          type: array
          items:
            $ref: '#/components/schemas/CampusBuilding'
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/CampusNode'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/CampusEdge'
        active_incidents:
          type: array
          items:
            $ref: '#/components/schemas/Incident'

    LocationItem:
      type: object
      required: [id, name, building, floor, node_type, landmark]
      properties:
        id:
          type: string
        name:
          type: string
        building:
          type: string
        floor:
          type: integer
        node_type:
          $ref: '#/components/schemas/NodeType'
        landmark:
          type: string

    LocationsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LocationItem'

    IncidentsListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Incident'

    CalculateRouteRequest:
      type: object
      required: [origin_node_id, destination_node_id, reduced_mobility]
      properties:
        origin_node_id:
          type: string
        destination_node_id:
          type: string
        reduced_mobility:
          type: boolean
          default: false
        prefer_covered:
          type: boolean
          default: false
        use_live_weather:
          type: boolean
          default: true
        simulate_rain:
          type: boolean
          default: false
          description: Simula lluvia en la demo; penaliza tramos exteriores (is_covered=false).
        algorithm:
          $ref: '#/components/schemas/SearchAlgorithm'
        simulated_blocked_node_ids:
          type: array
          items:
            type: string
        simulated_blocked_edge_ids:
          type: array
          items:
            type: string
      example:
        origin_node_id: n-entrada-sur
        destination_node_id: n-aula-204
        reduced_mobility: true
        prefer_covered: false
        use_live_weather: true
        simulate_rain: false
        algorithm: astar
        simulated_blocked_node_ids: []
        simulated_blocked_edge_ids: []

    RouteStep:
      type: object
      required: [order, from_node_id, to_node_id, floor, edge_type, distance_m, edge_weight, instruction]
      properties:
        order:
          type: integer
        from_node_id:
          type: string
        to_node_id:
          type: string
        floor:
          type: integer
        edge_type:
          $ref: '#/components/schemas/EdgeType'
        distance_m:
          type: integer
        edge_weight:
          type: number
          format: float
          description: Costo efectivo aplicado por el grafo ponderado en este tramo.
        instruction:
          type: string

    AvoidedConflict:
      type: object
      required: [incident_id, target_name, conflict_type, reason]
      properties:
        incident_id:
          type: string
        target_name:
          type: string
        conflict_type:
          $ref: '#/components/schemas/ConflictType'
        reason:
          type: string

    RouteMetrics:
      type: object
      required: [total_distance_m, estimated_time_min, floors_traversed, uses_elevator, uses_ramp, uses_stairs]
      properties:
        total_distance_m:
          type: integer
        estimated_time_min:
          type: number
          format: float
        floors_traversed:
          type: array
          items:
            type: integer
        uses_elevator:
          type: boolean
        uses_ramp:
          type: boolean
        uses_stairs:
          type: boolean

    GraphStats:
      type: object
      description: Telemetría de la búsqueda en grafo ponderado.
      required: [algorithm_used, total_weight, nodes_explored]
      properties:
        algorithm_used:
          $ref: '#/components/schemas/SearchAlgorithm'
        total_weight:
          type: number
          format: float
        nodes_explored:
          type: integer

    CalculateRouteResponse:
      type: object
      required: [origin_node_id, destination_node_id, reduced_mobility, accessibility_verified, weather_applied, metrics, graph_stats, path_node_ids, path_edge_ids, steps, avoided_conflicts]
      properties:
        origin_node_id:
          type: string
        destination_node_id:
          type: string
        reduced_mobility:
          type: boolean
        accessibility_verified:
          type: boolean
        weather_applied:
          type: object
          required: [condition, rain_avoidance_active]
          properties:
            condition:
              type: string
              enum: [clear, cloudy, rain, storm, unknown]
            rain_avoidance_active:
              type: boolean
        metrics:
          $ref: '#/components/schemas/RouteMetrics'
        graph_stats:
          $ref: '#/components/schemas/GraphStats'
        path_node_ids:
          type: array
          items:
            type: string
        path_edge_ids:
          type: array
          items:
            type: string
        steps:
          type: array
          items:
            $ref: '#/components/schemas/RouteStep'
        avoided_conflicts:
          type: array
          items:
            $ref: '#/components/schemas/AvoidedConflict'

    WeatherResponse:
      type: object
      required: [temperature_c, precipitation_mm, condition, rain_alert, source, fallback_used, fetched_at]
      properties:
        temperature_c:
          type: number
          format: float
        precipitation_mm:
          type: number
          format: float
        condition:
          type: string
          enum: [clear, cloudy, rain, storm, unknown]
        rain_alert:
          type: boolean
        source:
          type: string
        fallback_used:
          type: boolean
        fetched_at:
          type: string
          format: date-time
      example:
        temperature_c: 21.4
        precipitation_mm: 0.0
        condition: clear
        rain_alert: false
        source: open-meteo
        fallback_used: false
        fetched_at: '2026-11-21T12:00:00Z'

  responses:
    Unauthorized:
      description: Token faltante o inválido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: {code: UNAUTHORIZED, message: Token faltante o inválido}
    ValidationError:
      description: Datos inválidos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: {code: VALIDATION_ERROR, message: Los datos enviados no cumplen el contrato}
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: {code: NOT_FOUND, message: Recurso no encontrado}

paths:
  /api/v1/health:
    get:
      tags: [Health]
      summary: Estado del servidor y conexión con Supabase
      operationId: getHealth
      responses:
        '200':
          description: Servicio operativo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Perfil y preferencias del estudiante autenticado
      operationId: getCurrentUser
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Perfil del estudiante
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/preferences:
    patch:
      tags: [Auth]
      summary: Actualizar preferencias persistentes de movilidad
      operationId: updatePreferences
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePreferencesRequest'
      responses:
        '200':
          description: Preferencias actualizadas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/campus/map:
    get:
      tags: [Campus]
      summary: Grafo 2.5D del campus simulado e incidencias activas
      operationId: getCampusMap
      parameters:
        - name: floor
          in: query
          required: false
          description: Filtrar por piso (1 o 2)
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Mapa del campus
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampusMapResponse'
              example:
                campus_name: Campus Central Simulado
                viewbox: {width: 1000, height: 640}
                floors: [1, 2]
                buildings:
                  - {id: bld-a, name: Edificio A (Ingeniería), x: 150, y: 110, width: 400, height: 210, floors: 2, color: '#3b82f6'}
                  - {id: bld-b, name: Edificio B (Biblioteca y Labs), x: 610, y: 130, width: 280, height: 410, floors: 2, color: '#10b981'}
                nodes:
                  - {id: n-entrada-sur, name: Entrada Principal Sur, building: Exterior, floor: 1, node_type: entrance, x: 120, y: 540, z: 0, is_destination: true, landmark: Frente a la garita y parada de bus}
                  - {id: n-patio-central, name: Patio Central, building: Exterior, floor: 1, node_type: corridor, x: 340, y: 440, z: 0, is_destination: false, landmark: Explanada con fuente central}
                  - {id: n-biblioteca, name: Biblioteca Central, building: Edificio B, floor: 1, node_type: room, x: 680, y: 490, z: 0, is_destination: true, landmark: Puerta vidriada junto al patio}
                  - {id: n-cafeteria, name: Cafetería Universitaria, building: Edificio A, floor: 1, node_type: room, x: 180, y: 260, z: 0, is_destination: true, landmark: Planta baja ala oeste}
                  - {id: n-rampa-sur, name: Rampa Accesible Sur, building: Edificio B, floor: 1, node_type: ramp, x: 520, y: 520, z: 0, is_destination: false, landmark: Rampa techada con barandas junto a Biblioteca}
                  - {id: n-hall-a-p1, name: Hall Edificio A (Piso 1), building: Edificio A, floor: 1, node_type: corridor, x: 340, y: 260, z: 0, is_destination: false, landmark: Recepción y tablero de avisos}
                  - {id: n-escalera-a-p1, name: Escalera Central A (Piso 1), building: Edificio A, floor: 1, node_type: stairs, x: 420, y: 200, z: 0, is_destination: false, landmark: Escalera principal de concreto}
                  - {id: n-ascensor-a-p1, name: Ascensor Edificio A (Piso 1), building: Edificio A, floor: 1, node_type: elevator, x: 340, y: 160, z: 0, is_destination: false, landmark: Al costado del hall de Rectorado}
                  - {id: n-ascensor-b-p1, name: Ascensor Edificio B (Piso 1), building: Edificio B, floor: 1, node_type: elevator, x: 720, y: 280, z: 0, is_destination: false, landmark: Pasillo interno norte de Biblioteca}
                  - {id: n-escalera-a-p2, name: Escalera Central A (Piso 2), building: Edificio A, floor: 2, node_type: stairs, x: 420, y: 200, z: 4, is_destination: false, landmark: Descanso superior Edificio A}
                  - {id: n-ascensor-a-p2, name: Ascensor Edificio A (Piso 2), building: Edificio A, floor: 2, node_type: elevator, x: 340, y: 160, z: 4, is_destination: false, landmark: Frente al pasillo de aulas 200}
                  - {id: n-ascensor-b-p2, name: Ascensor Edificio B (Piso 2), building: Edificio B, floor: 2, node_type: elevator, x: 720, y: 280, z: 4, is_destination: false, landmark: Junto al puente techado del piso 2}
                  - {id: n-pasillo-p2, name: Puente Cubierto Piso 2, building: Edificio A-B, floor: 2, node_type: corridor, x: 560, y: 240, z: 4, is_destination: false, landmark: Pasarela cerrada entre Edificio A y B}
                  - {id: n-aula-204, name: Aula 204 (Ingeniería), building: Edificio A, floor: 2, node_type: room, x: 500, y: 150, z: 4, is_destination: true, landmark: Segunda puerta a la derecha del puente}
                  - {id: n-lab-computo, name: Laboratorio de Cómputo, building: Edificio B, floor: 2, node_type: room, x: 840, y: 180, z: 4, is_destination: true, landmark: Fondo del pasillo piso 2 Edificio B}
                edges:
                  - {id: e-1, from_node_id: n-entrada-sur, to_node_id: n-patio-central, distance_m: 45, base_weight: 1.0, edge_type: outdoor, is_accessible: true, is_covered: false, bidirectional: true}
                  - {id: e-2, from_node_id: n-entrada-sur, to_node_id: n-rampa-sur, distance_m: 60, base_weight: 1.15, edge_type: ramp, is_accessible: true, is_covered: true, bidirectional: true}
                  - {id: e-3, from_node_id: n-patio-central, to_node_id: n-hall-a-p1, distance_m: 35, base_weight: 1.0, edge_type: outdoor, is_accessible: true, is_covered: false, bidirectional: true}
                  - {id: e-4, from_node_id: n-hall-a-p1, to_node_id: n-cafeteria, distance_m: 30, base_weight: 1.0, edge_type: corridor, is_accessible: true, is_covered: true, bidirectional: true}
                  - {id: e-5, from_node_id: n-hall-a-p1, to_node_id: n-escalera-a-p1, distance_m: 20, base_weight: 1.0, edge_type: corridor, is_accessible: true, is_covered: true, bidirectional: true}
                  - {id: e-6, from_node_id: n-hall-a-p1, to_node_id: n-ascensor-a-p1, distance_m: 25, base_weight: 1.0, edge_type: corridor, is_accessible: true, is_covered: true, bidirectional: true}
                  - {id: e-7, from_node_id: n-rampa-sur, to_node_id: n-biblioteca, distance_m: 35, base_weight: 1.0, edge_type: corridor, is_accessible: true, is_covered: true, bidirectional: true}
                  - {id: e-8, from_node_id: n-biblioteca, to_node_id: n-ascensor-b-p1, distance_m: 40, base_weight: 1.0, edge_type: corridor, is_accessible: true, is_covered: true, bidirectional: true}
                  - {id: e-9, from_node_id: n-escalera-a-p1, to_node_id: n-escalera-a-p2, distance_m: 15, base_weight: 1.4, edge_type: stairs, is_accessible: false, is_covered: true, bidirectional: true}
                  - {id: e-10, from_node_id: n-ascensor-a-p1, to_node_id: n-ascensor-a-p2, distance_m: 10, base_weight: 1.3, edge_type: elevator, is_accessible: true, is_covered: true, bidirectional: true}
                  - {id: e-11, from_node_id: n-ascensor-b-p1, to_node_id: n-ascensor-b-p2, distance_m: 10, base_weight: 1.3, edge_type: elevator, is_accessible: true, is_covered: true, bidirectional: true}
                  - {id: e-12, from_node_id: n-escalera-a-p2, to_node_id: n-aula-204, distance_m: 25, base_weight: 1.0, edge_type: corridor, is_accessible: true, is_covered: true, bidirectional: true}
                  - {id: e-13, from_node_id: n-ascensor-a-p2, to_node_id: n-aula-204, distance_m: 30, base_weight: 1.0, edge_type: corridor, is_accessible: true, is_covered: true, bidirectional: true}
                  - {id: e-14, from_node_id: n-ascensor-b-p2, to_node_id: n-pasillo-p2, distance_m: 25, base_weight: 1.0, edge_type: corridor, is_accessible: true, is_covered: true, bidirectional: true}
                  - {id: e-15, from_node_id: n-pasillo-p2, to_node_id: n-aula-204, distance_m: 20, base_weight: 1.0, edge_type: corridor, is_accessible: true, is_covered: true, bidirectional: true}
                  - {id: e-16, from_node_id: n-ascensor-b-p2, to_node_id: n-lab-computo, distance_m: 30, base_weight: 1.0, edge_type: corridor, is_accessible: true, is_covered: true, bidirectional: true}
                active_incidents:
                  - {id: inc-101, target_type: node, node_id: n-ascensor-a-p1, edge_id: null, conflict_type: elevator_broken, severity: blocking, status: active, description: Ascensor Edificio A fuera de servicio por mantenimiento, reported_at: '2026-11-21T10:15:00Z', resolved_at: null}

  /api/v1/campus/locations:
    get:
      tags: [Campus]
      summary: Puntos seleccionables como origen (A) o destino (B)
      operationId: listCampusLocations
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: floor
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Lista de ubicaciones
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationsResponse'
              example:
