  /api/v1/incidents:
    get:
      tags: [Incidents]
      summary: Listar incidencias reportadas
      operationId: listIncidents
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [active, resolved, all]
            default: active
      responses:
        '200':
          description: Lista de incidencias
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentsListResponse'
              example:
                items:
                  - {id: inc-101, target_type: node, node_id: n-ascensor-a-p1, edge_id: null, conflict_type: elevator_broken, severity: blocking, status: active, description: Ascensor Edificio A fuera de servicio por mantenimiento, reported_at: '2026-11-21T10:15:00Z', resolved_at: null}
    post:
      tags: [Incidents]
      summary: Reportar una incidencia (requiere login)
      operationId: createIncident
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIncidentRequest'
      responses:
        '201':
          description: Incidencia creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Incident'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/incidents/{incidentId}:
    patch:
      tags: [Incidents]
      summary: Resolver o actualizar una incidencia (requiere login)
      operationId: updateIncident
      security:
        - BearerAuth: []
      parameters:
        - name: incidentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateIncidentRequest'
      responses:
        '200':
          description: Incidencia actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Incident'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/routes/calculate:
    post:
      tags: [Routes]
      summary: Ruta óptima A→B por grafo ponderado (A* / Dijkstra)
      operationId: calculateRoute
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalculateRouteRequest'
      responses:
        '200':
          description: Ruta calculada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalculateRouteResponse'
              example:
                origin_node_id: n-entrada-sur
                destination_node_id: n-aula-204
                reduced_mobility: true
                accessibility_verified: true
                weather_applied: {condition: clear, rain_avoidance_active: false}
                metrics: {total_distance_m: 190, estimated_time_min: 3.6, floors_traversed: [1, 2], uses_elevator: true, uses_ramp: true, uses_stairs: false}
                graph_stats: {algorithm_used: astar, total_weight: 202.0, nodes_explored: 9}
                path_node_ids: [n-entrada-sur, n-rampa-sur, n-biblioteca, n-ascensor-b-p1, n-ascensor-b-p2, n-pasillo-p2, n-aula-204]
                path_edge_ids: [e-2, e-7, e-8, e-11, e-14, e-15]
                steps:
                  - {order: 1, from_node_id: n-entrada-sur, to_node_id: n-rampa-sur, floor: 1, edge_type: ramp, distance_m: 60, edge_weight: 69.0, instruction: 'Desde Entrada Principal Sur, toma la Rampa Accesible Sur (60 m, cubierta) hacia el Edificio B.'}
                  - {order: 2, from_node_id: n-rampa-sur, to_node_id: n-biblioteca, floor: 1, edge_type: corridor, distance_m: 35, edge_weight: 35.0, instruction: 'Continúa 35 m por el pasillo cubierto hasta Biblioteca Central.'}
                  - {order: 3, from_node_id: n-biblioteca, to_node_id: n-ascensor-b-p1, floor: 1, edge_type: corridor, distance_m: 40, edge_weight: 40.0, instruction: 'Avanza 40 m por el pasillo interno norte hasta el Ascensor Edificio B.'}
                  - {order: 4, from_node_id: n-ascensor-b-p1, to_node_id: n-ascensor-b-p2, floor: 2, edge_type: elevator, distance_m: 10, edge_weight: 13.0, instruction: 'Sube en el Ascensor Edificio B hasta el piso 2.'}
                  - {order: 5, from_node_id: n-ascensor-b-p2, to_node_id: n-pasillo-p2, floor: 2, edge_type: corridor, distance_m: 25, edge_weight: 25.0, instruction: 'Cruza 25 m por el Puente Cubierto del piso 2 hacia el Edificio A.'}
                  - {order: 6, from_node_id: n-pasillo-p2, to_node_id: n-aula-204, floor: 2, edge_type: corridor, distance_m: 20, edge_weight: 20.0, instruction: 'Avanza 20 m hasta el Aula 204, segunda puerta a la derecha.'}
                avoided_conflicts:
                  - {incident_id: inc-101, target_name: Ascensor Edificio A (Piso 1), conflict_type: elevator_broken, reason: 'Evitado por falla reportada; ruta desviada por Rampa Sur y Ascensor Edificio B.'}
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: No existe ruta viable o accesible por las incidencias activas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: NO_ACCESSIBLE_ROUTE
                  message: No hay ruta accesible al piso 2 porque todos los ascensores están fuera de servicio.
                  details:
                    blocking_incident_ids: [inc-101, inc-102]

